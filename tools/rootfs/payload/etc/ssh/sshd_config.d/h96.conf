# H96Max: keys only, root by key only, on the LAN dongle (DHCP).
# The only key is build/keys/h96max_ed25519 (tools/h96 on the PC). Root's password is "*" (no
# password matches it; not "!", which this OpenSSH reads as a locked account and refuses even
# with a key), so there is no password login anywhere, console included.
PermitRootLogin prohibit-password
AuthenticationMethods publickey
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
MaxAuthTries 3
